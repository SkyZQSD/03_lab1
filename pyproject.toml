[project]
name = "uv_project"
version = "0.1.0"
description = "Projet Storage S3"
readme = "README.md"
authors = [
    { name = "j-hogommat-ece", email = "julien.hogommat@edu.ece.fr" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-duckdb>=1.11.0",
    "duckdb>=1.5.6",
    "faker>=40.37.0",
]

[project.scripts]
uv_project = "uv_project:main"
dataset-users = "uv_project.dataset_users:main"
dataset-orders = "uv_project.dataset_orders:main"
orders-report = "uv_project.orders_report:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"
